name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify application
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AI_PROVIDER: rules
      PAYMENT_PROVIDER: mock
      NEXT_PUBLIC_APP_URL: https://fitora-ci.invalid
      DEMO_MERCHANT_NAME: Fitora CI Demo Merchant
      DEMO_MERCHANT_URL: https://fitora-ci.invalid
      DEMO_MERCHANT_COUNTRY_CODE: US
      DEMO_MERCHANT_FORCE_DECLINE: "false"
      # Public mock-only fixture, not a credential or deployment secret.
      CHECKOUT_SIGNING_SECRET: fitora-ci-only-public-placeholder-signing-key-v1

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
